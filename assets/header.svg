<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 800 54px 'Segoe UI', Arial, sans-serif; fill: #ffffff; animation: fade 1.2s ease-out both; }
    .sub  { font: 600 22px 'Segoe UI', Arial, sans-serif; animation: fade 1.2s 0.4s ease-out both; }
    .tag  { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #c4b5fd; animation: fade 1.2s 0.8s ease-out both; }
    .a { animation: float 6s ease-in-out infinite; }
    .b { animation: float 8s ease-in-out infinite reverse; }
    .c { animation: float 7s 1s ease-in-out infinite; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  </style>

  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>

  <circle class="a" cx="110" cy="70" r="46" fill="#36BCF7" opacity="0.12"/>
  <circle class="b" cx="890" cy="170" r="60" fill="#A78BFA" opacity="0.14"/>
  <circle class="c" cx="780" cy="48" r="26" fill="#36BCF7" opacity="0.15"/>
  <circle class="b" cx="200" cy="195" r="30" fill="#A78BFA" opacity="0.12"/>

  <text class="name" x="500" y="108" text-anchor="middle">Nikhil Chauhan</text>
  <text class="sub" x="500" y="150" text-anchor="middle" fill="url(#accent)">Mobile App Developer  |  Android and Flutter</text>
  <text class="tag" x="500" y="188" text-anchor="middle">Founding Engineer  •  Hackathon Runner-Up  •  Open Source Supercontributor</text>
</svg>
